<!-- Header Section -->
<header
    class="bg-white print:border-none print:shadow-none border-b border-gray-200 shadow-sm sticky top-0 z-50 dark:bg-gray-800 dark:border-gray-700">
    <nav class="container mx-auto px-4 flex justify-between items-center py-4">
        <!-- Site Title/Logo -->
        {% if site.active_lang == site.default_lang %}
        <a href="/"
            class="text-2xl font-bold text-gray-900 dark:text-white hover:text-gray-700 dark:hover:text-gray-300 transition-colors duration-200">
            {{ site.title }}
        </a>
        {% else %}
        <a href="/{{ site.active_lang }}/"
            class="text2xl font-bold text-gray-900 dark:text-white hover:text-gray-700 dark:hover:text-gray-300 transition-colors duration-200">
            {{ site.title }}
        </a>
        {% endif %}
        <!-- Navigation Links -->
        <div class="flex space-x-6 text-sm justify-center items-center font-medium print:hidden">
            <a href="{% if site.active_lang == site.default_lang %}/{% else %}/{{ site.active_lang }}/{% endif %}"
                class="text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white transition-colors duration-200 border-b-2 border-transparent hover:border-gray-300 dark:hover:border-gray-600 pb-1">Home</a>
            <a href="{% if site.active_lang == site.default_lang %}/blog/{% else %}/{{ site.active_lang }}/blog/{% endif %}"
                class="text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white transition-colors duration-200 border-b-2 border-transparent hover:border-gray-300 dark:hover:border-gray-600 pb-1">Blog</a>
            <a href="{% if site.active_lang == site.default_lang %}/about/{% else %}/{{ site.active_lang }}/about/{% endif %}"
                class="text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white transition-colors duration-200 border-b-2 border-transparent hover:border-gray-300 dark:hover:border-gray-600 pb-1">About</a>
            {% if site.github_username %}
            <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer"
                class="text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white transition-colors duration-200 border-b-2 border-transparent hover:border-gray-300 dark:hover:border-gray-600 pb-1">GitHub</a>
            {% endif %}
            <div>
                {% include lang.html %}
            </div>
        </div>
    </nav>
</header>
